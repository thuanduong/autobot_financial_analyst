<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading System</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <header class="top-nav">
        <div style="display: flex; align-items: center;">
            <a href="/" class="nav-brand">
                <i class="fa-solid fa-robot"></i> <span>AUTO.TRADE</span>
            </a>
            <nav class="nav-links">
                <a href="#" id="nav-dashboard" class="nav-item active" onclick="switchView('dashboard'); return false;">
                    <i class="fa-solid fa-chart-pie"></i> <span class="hide-mobile">Dash</span>
                </a>
                
                <a href="#" id="nav-terminal" class="nav-item" onclick="switchView('terminal'); return false;">
                    <i class="fa-solid fa-terminal"></i> Terminal
                </a>
                
                <a href="#" id="nav-radar" class="nav-item" onclick="switchView('radar'); return false;">
                    <i class="fa-solid fa-satellite-dish"></i> <span class="hide-mobile">Radar</span>
                </a>
            </nav>
        </div>

        <div class="nav-user">
            <a href="#" onclick="toggleTheme()" title="Đổi màu giao diện" style="color: var(--text-muted); margin-right: 10px;">
                <i class="fa-solid fa-palette"></i>
            </a>

            <div id="user-info" style="font-size: 0.9rem; color: var(--text-muted);">Guest</div>
            
            <a href="#" onclick="logout()" title="Đổi tài khoản" style="color: var(--text-main);">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/main.js"></script> 

</body>
</html>
