{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>📡 Radar Quét Thị Trường (Realtime)</h2>
    <span style="font-size: 0.9rem; color: #8b949e;">Cập nhật mỗi 5 giây...</span>
</div>

<table class="radar-table">
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Giá (Price)</th>
            <th>RSI (14)</th>
            <th>Tín Hiệu (AI)</th>
            <th>Độ Mạnh (Score)</th>
            <th>Trạng Thái</th>
        </tr>
    </thead>
    <tbody id="radar-body">
        <tr>
            <td colspan="6" style="text-align: center; color: #8b949e;">Đang tải dữ liệu...</td>
        </tr>
    </tbody>
</table>
{% endblock %}
